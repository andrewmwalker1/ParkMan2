<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,600;0,700;1,600;1,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>ParkMan2</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }

      /* Persistent nav shell (src/components/Layout.jsx, Sidebar.jsx) --
         media queries can't be expressed in inline styles, so the
         structural (not colour) parts of the shell live here. Sidebar
         collapses to a horizontal strip above the topbar below 720px. */
      .pm2-shell { min-height: 100vh; display: flex; flex-direction: row; }
      .pm2-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .pm2-sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
      .pm2-wordmark { margin: 0 6px 18px; }
      @media (max-width: 720px) {
        .pm2-shell { flex-direction: column; }
        .pm2-sidebar-nav { flex-direction: row; flex-wrap: wrap; align-items: center; }
        .pm2-wordmark { margin: 0 12px 0 0; }
      }
    </style>
    <script>
      // Other half of the public/404.html GitHub Pages SPA fallback --
      // restores the originally-requested path before React Router
      // mounts, so a fresh navigation to e.g. /customers/:id lands on
      // the right screen instead of the Dashboard.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script type="module" src="/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
