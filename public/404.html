<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ParkMan2</title>
    <script>
      // GitHub Pages has no server-side routing, so a fresh navigation to
      // any client-side route (e.g. a bookmarked /ParkMan2/customers/:id,
      // or a page refresh) 404s here instead of loading the app. Encode
      // the requested path (kept WITH the /ParkMan2 prefix, since
      // BrowserRouter's basename expects it there) into a query string
      // and redirect to the real index.html, which restores it via
      // history.replaceState before React Router mounts (see the
      // matching script in index.html) -- the standard GitHub Pages SPA
      // fallback.
      var path = location.pathname + location.search + location.hash;
      location.replace(location.origin + "/ParkMan2/?redirect=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
